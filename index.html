<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HearHere - Live Prototype</title>
    <style>
        :root {
            --bg-page: #010118;
            --bg-phone: #080a22;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --text-dimmer: #64748b;
            --accent-green: #4ade80; 
            --accent-latency: #ff007f; 
            --btn-pink: #c084fc;
            --btn-cyan: #22d3ee;
            --creator-bg: #0f172a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .mode-toggle-bar {
            margin-bottom: 10px;
            z-index: 10;
        }
        .mode-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--text-dimmer);
            color: var(--text-dim);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }
        .mode-btn.active {
            background: var(--btn-pink);
            color: #000;
            border-color: var(--btn-pink);
            font-weight: bold;
        }

        .wrapper {
            position: relative;
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .phone-mockup {
            background-color: var(--bg-phone);
            width: 100%;
            height: calc(100vh - 80px);
            min-height: 580px;
            max-height: 720px;
            border-radius: 40px;
            box-shadow: 0 0 50px rgba(6, 182, 212, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        header { padding: 1rem 1.5rem; text-align: left; }
        .main-title { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; color: var(--text-main); margin: 0 0 0.5rem 0;
